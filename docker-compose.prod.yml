# Production overlay for a single AWS Lightsail instance.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What this changes against the base file, and why each one matters on a box
# with a public IP:
#
#   * Only Caddy claims a host port. MySQL, the API and the SPA publish
#     nothing at all — they reach each other over the compose network, and
#     anything you need from them on the box is one `docker compose exec`
#     away. That avoids both failure modes of publishing: colliding with
#     whatever else runs on a shared instance, and exposing a database if the
#     bind address is ever wrong. Docker writes its own iptables rules and
#     bypasses ufw, so a stray 0.0.0.0 binding is public whatever the host
#     firewall says. Local development adds the ports back through
#     docker-compose.dev.yml.
#   * The prod profile, which is not in the validator's relaxed set, so the
#     application refuses to start on a placeholder secret, an insecure
#     refresh cookie, a wildcard CORS origin or an enabled Swagger UI.
#   * Memory ceilings. The JVM is told to take 75% of what it can see, and
#     without a limit that is 75% of the whole host — which starves MySQL on
#     a 4 GB instance and gets the container OOM-killed under load.
#   * Log rotation. The default json-file driver grows without bound and
#     fills a 60 GB disk eventually; nobody notices until MySQL cannot write.

services:
  mysql:
    mem_limit: 1200m
    environment:
      # The base file's default would otherwise apply.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # Default is 128 MB, which on a shared 4 GB box leaves MySQL thrashing.
      - --innodb-buffer-pool-size=512M
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  backend:
    mem_limit: 1600m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # prod sets refresh-cookie-secure true in application-prod.yml; this is
      # here so the value is visible in one place with the rest of the stack.
      REFRESH_COOKIE_SECURE: 'true'
      SWAGGER_ENABLED: 'false'
      # Same origin through Caddy and nginx, so no cross-origin request is
      # ever made. The validator rejects '*', and an empty list is correct
      # here rather than a lie about which origins are allowed.
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Kolkata}
      # bcrypt strength is not settable here: application.yml fixes it at 12,
      # which is what the validator wants anyway. An env var for it would
      # read like a knob that works.
    # The image allows 45 seconds to start, which is generous on a machine
    # that is not sharing its CPUs. On a shared instance Spring Boot startup
    # — almost entirely class loading and JIT, so almost entirely CPU — is
    # whatever is left over: measured at 190 seconds on two vCPUs running a
    # dozen other containers. The old window marked a perfectly healthy
    # application unhealthy for three minutes of every deploy, which is how
    # a health status stops being worth reading.
    healthcheck:
      start_period: 300s
      interval: 30s
      timeout: 5s
      retries: 3
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/actuator/health/liveness']
    logging: *logging

  frontend:
    # Published on the loopback so a reverse proxy already running on the host
    # can reach it. Harmless when Caddy is used instead — nothing outside the
    # box can reach 127.0.0.1 — and necessary when it is not.
    #
    # Default 8081 rather than 8080: on a shared instance 8080 is the port
    # something else is most likely to have taken already.
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8081}:80'
    mem_limit: 128m
    logging: *logging

  # Opt-in, because an instance that already serves HTTPS does not need a
  # second thing fighting for 80 and 443:
  #
  #   docker compose ... up -d                      → no Caddy; front it with
  #                                                   the host's own proxy
  #   docker compose ... --profile edge-tls up -d   → Caddy terminates TLS
  #
  # A service in a profile is not started unless that profile is named, but
  # its variables are still interpolated, so ACME_EMAIL has to be set either
  # way. The template ships a value for it.
  caddy:
    profiles: ['edge-tls']
    image: caddy:2.8-alpine
    container_name: attendance-caddy
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the hostname the certificate is for}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt expiry notices}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive a recreate. Without this volume every redeploy
      # requests a new certificate and Let's Encrypt rate-limits the domain
      # after five in a week.
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: *logging
    networks: [attendance]

volumes:
  caddy-data:
  caddy-config:
