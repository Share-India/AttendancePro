spring:
  application:
    name: attendance

  # .env is already KEY=value with # comments, which is properties format, so
  # Spring can read it directly and `mvnw spring-boot:run` needs no wrapper
  # script exporting variables first. Both paths are listed because the run
  # may start from the repository root or from backend/. Optional, so a
  # machine without the file still boots on the defaults below.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # How to reach the SMTP server. What the mail says and where its links point
  # is app.mail further down; this is only the transport.
  #
  # STARTTLS on 587 rather than implicit TLS on 465: 465 works too, but it
  # needs a different property set, and getting the pair out of step produces a
  # connection that hangs rather than one that fails.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # Refuse to continue in the clear if STARTTLS is not offered.
            # Without this a server that has lost its certificate silently
            # downgrades, and the password is sent in plain text.
            required: true
          ssl:
            # Check that the certificate actually belongs to MAIL_HOST.
            # Jakarta Mail 2.1 turns this on by default, but it is stated here
            # because it decides which hostnames work and that is not obvious:
            # this provider serves a certificate for the host it is ASKED for.
            # mail.shareindia.co.in presents a certificate covering both
            # mail. and webmail.; webmail.shareindia.co.in presents one for
            # cp01.premierdc.in and nothing else. Same machine, same IP —
            # so webmail. as MAIL_HOST fails verification and sends nothing,
            # with an error that reads like a broken certificate rather than
            # the wrong name.
            checkserveridentity: true
          # Without these a dead mail host hangs the request thread holding
          # the transaction open, and a slow SMTP server becomes an outage.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendance_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      pool-name: attendance-pool

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway in every environment. Never 'update'.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true

app:
  jwt:
    # MUST be overridden in every non-dev environment. Minimum 64 bytes for HS512.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1jaGFuZ2UtbWUtbm93LTEyMzQ1Njc4OTA=}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    issuer: attendance-api

  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    account-lockout-minutes: ${ACCOUNT_LOCKOUT_MINUTES:30}
    password-reset-token-validity-minutes: ${PASSWORD_RESET_VALIDITY_MINUTES:30}
    # A new joiner's setup link is not a reset. Thirty minutes is right for a
    # link somebody asked for seconds ago and is waiting on; it is wrong for
    # one sent to forty people at once, some of whom are on leave, in another
    # office, or will not open work mail until Monday. An expired setup link
    # means HR issuing another one for every person who was slow.
    setup-token-validity-hours: ${SETUP_TOKEN_VALIDITY_HOURS:72}
    bcrypt-strength: 12
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    # Requests per source IP to the credential endpoints. Account lockout stops
    # one attacker guessing at one account; this bounds the opposite shape, one
    # password sprayed across many accounts.
    auth-rate-limit:
      max-requests: ${AUTH_RATE_LIMIT_MAX:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    refresh-cookie-same-site: Strict

  mail:
    # Off by default. A developer running the test suite or clicking through a
    # local build has no business putting real mail in a real inbox, and a
    # deployment whose links do not yet resolve would spend each one-time token
    # on a dead link. Turn it on deliberately, per environment.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@localhost}
    from-name: ${MAIL_FROM_NAME:Attendance Pro}
    # Links in mail cannot be relative. Wrong here means mail that looks
    # correct and whose every link is broken, so the startup validator checks
    # it rather than trusting it.
    base-url: ${APP_BASE_URL:http://localhost:5173}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    # Content-Disposition must be exposed or a browser download cannot read the
    # filename the server chose, and every export saves as a guessed name.
    exposed-headers: X-Request-Id,Content-Disposition
    allow-credentials: true
    max-age: 3600

  company:
    default-timezone: ${COMPANY_TIMEZONE:Asia/Kolkata}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # spring-boot-starter-mail registers a health indicator that opens an SMTP
    # connection, and a failure there makes the whole application report DOWN.
    #
    # That is the wrong severity by a wide margin. Mail is best effort here —
    # EmailService already swallows send failures, because the approval or
    # account the message is about has committed either way. Letting an
    # unreachable mail host turn /actuator/health into a 503 would fail the
    # container's healthcheck and take a perfectly working attendance system
    # out of service because nobody could be told about a leave request.
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.company.attendance: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
