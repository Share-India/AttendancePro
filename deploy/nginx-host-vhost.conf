# Virtual host for the instance's own nginx, when it already owns 80 and 443
# and this stack must sit behind it rather than run its own TLS edge.
#
# Install:
#   sudo cp deploy/nginx-host-vhost.conf /etc/nginx/sites-available/attendance
#   sudo ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file adds one server block and touches nothing else, so another
# application on the same instance is unaffected: nginx selects between them
# on server_name alone.
#
# TLS, two cases:
#
#   Not behind Cloudflare — let certbot write the 443 block and wire up
#   renewal, which is the part that matters in ninety days:
#       sudo certbot --nginx -d attendance.shareindiainsurance.com
#
#   Behind Cloudflare's proxy — certbot cannot work, because the ACME
#   challenge is answered by Cloudflare and never reaches here. Two ways to
#   get a certificate onto this origin instead, both ending in the TLS block
#   below:
#
#     Cloudflare Origin Certificate — SSL/TLS -> Origin Server. Free, fifteen
#     years, no challenge. Pairs with SSL/TLS mode "Full (strict)", which
#     both encrypts and verifies. Needs Cloudflare dashboard access.
#
#     Self-signed — deploy/origin-selfsigned-cert.sh. Needs nobody's
#     permission. Pairs with mode "Full", which encrypts but does not verify
#     the origin. Weaker than strict, far better than "Flexible", where the
#     Cloudflare-to-origin hop carries passwords in plain text across the
#     public internet.
#
#   Either can be installed now without breaking anything: adding a 443
#   listener does not stop port 80 answering, so a Cloudflare still set to
#   Flexible carries on working untouched.

# Behind a proxy that terminates TLS, the original scheme arrives in a header
# and this hop is plain HTTP. Passing $scheme straight through would overwrite
# "https" with "http" and the backend would believe the request arrived
# unencrypted. Falls back to $scheme when no proxy is in front.
#
# Prefixed, because a map name is global to nginx and another site on this box
# may well define its own.
map $http_x_forwarded_proto $attendance_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;
    server_name attendance.shareindiainsurance.com;

    # --- Behind Cloudflare, uncomment once the origin certificate is in place
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # ssl_certificate     /etc/ssl/cloudflare/attendance.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/attendance.key;

    # Real client addresses. This application stores the IP against every
    # punch and every audit entry; without this every employee is recorded as
    # whichever Cloudflare edge forwarded them, which makes that column worse
    # than useless — it looks like data.
    #
    # Generate the ranges file first (it changes occasionally):
    #   sudo deploy/cloudflare-real-ip.sh
    # include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    # One location: the container's own nginx already serves the SPA, proxies
    # /api to the backend, sets the cache and security headers, and handles
    # client-side routing. Re-implementing any of that here would give two
    # places to change it and one of them would be forgotten.
    location / {
        proxy_pass http://127.0.0.1:8081;

        # HTTP/1.1 to the upstream, or nginx falls back to 1.0 and cannot
        # forward a chunked response. Report exports are streamed and chunked,
        # so on 1.0 they arrive truncated or not at all.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The header that has to survive every hop. The container's nginx
        # forwards what arrives rather than overwriting it, and the backend
        # decides from it whether the request was encrypted.
        proxy_set_header X-Forwarded-Proto $attendance_proto;

        # An export of tens of thousands of rows takes longer than the default
        # 60s, and buffering it would defeat the point of streaming it.
        proxy_read_timeout 300s;
        proxy_buffering off;

        # Enough for a bulk-import CSV; the API enforces its own row limits.
        client_max_body_size 12m;
    }
}
