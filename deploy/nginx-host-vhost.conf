# Virtual host for the instance's own nginx, when it already owns 80 and 443
# and this stack sits behind it rather than running its own TLS edge.
#
# Two prerequisites, both in this directory. Run them first or nginx -t fails
# on a missing certificate and a missing include:
#
#   sudo sh deploy/origin-selfsigned-cert.sh attendance.shareindiainsurance.com
#   sudo sh deploy/cloudflare-real-ip.sh
#
# Then:
#
#   sudo cp deploy/nginx-host-vhost.conf /etc/nginx/sites-available/attendance
#   sudo ln -sf /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This adds one server block and touches nothing else, so another application
# on the same instance is unaffected: nginx selects between them on
# server_name alone.
#
# --- On the certificate ------------------------------------------------------
#
# As shipped this expects the self-signed certificate from the script above,
# which pairs with Cloudflare's SSL/TLS mode "Full": encrypted, origin not
# verified. Better than "Flexible", where the Cloudflare-to-origin hop carries
# passwords in plain text across the public internet.
#
# "Full (strict)" also verifies, and wants a Cloudflare Origin CA certificate
# (SSL/TLS -> Origin Server; free, fifteen years, no ACME challenge). If you
# have one, point ssl_certificate at it instead — nothing else changes.
#
# Not behind a proxy at all? Delete the 443 lines and let certbot write them,
# so renewal is wired up too:
#   sudo certbot --nginx -d attendance.shareindiainsurance.com

# Behind a proxy that terminates TLS, the original scheme arrives in a header
# and this hop is plain HTTP. Passing $scheme straight through would overwrite
# "https" with "http" and the backend would believe the request arrived
# unencrypted. Falls back to $scheme when nothing is in front.
#
# Prefixed, because a map name is global to nginx and another site on this box
# may well define its own.
map $http_x_forwarded_proto $attendance_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

server {
    # Port 80 stays open deliberately. Cloudflare in "Flexible" mode connects
    # on it, so this file can be installed before anyone touches the
    # Cloudflare settings and nothing breaks in the meantime.
    listen 80;
    listen [::]:80;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/ssl/attendance/attendance.shareindiainsurance.com.pem;
    ssl_certificate_key /etc/ssl/attendance/attendance.shareindiainsurance.com.key;

    # No "http2 on;". That directive is nginx 1.25.1 and later, and Ubuntu
    # 24.04 ships 1.24, where it is a configuration error. Cloudflare speaks
    # HTTP/1.1 to origins anyway, so it would buy nothing here.

    server_name attendance.shareindiainsurance.com;

    # Real client addresses. This application stores an IP against every punch
    # event, every sign-in attempt and every audit entry. Without this they all
    # record whichever Cloudflare edge forwarded the request, which is worse
    # than an empty column because it looks like evidence.
    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    # One location: the container's own nginx already serves the SPA, proxies
    # /api to the backend, sets the cache and security headers, and handles
    # client-side routing. Re-implementing any of that here would give two
    # places to change it and one of them would be forgotten.
    location / {
        proxy_pass http://127.0.0.1:8081;

        # HTTP/1.1 to the upstream, or nginx falls back to 1.0 and cannot
        # forward a chunked response. Report exports are streamed and chunked,
        # so on 1.0 they arrive truncated or not at all.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The header that has to survive every hop. The container's nginx
        # forwards what arrives rather than overwriting it, and the backend
        # decides from it whether the request was encrypted.
        proxy_set_header X-Forwarded-Proto $attendance_proto;

        # An export of tens of thousands of rows takes longer than the default
        # 60s, and buffering it would defeat the point of streaming it.
        proxy_read_timeout 300s;
        proxy_buffering off;

        # Enough for a bulk-import CSV; the API enforces its own row limits.
        client_max_body_size 12m;
    }
}
