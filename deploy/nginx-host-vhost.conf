# Virtual host for the instance's own nginx, when it already owns 80 and 443
# and this stack must sit behind it rather than run its own TLS edge.
#
# Install:
#   sudo cp deploy/nginx-host-vhost.conf /etc/nginx/sites-available/attendance
#   sudo ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add TLS to this exact file:
#   sudo certbot --nginx -d attendance.shareindiainsurance.com
#
# certbot rewrites this server block to listen on 443 with the certificate,
# and adds a second block redirecting 80 to 443. Do not hand-write that — it
# also wires up renewal, which is the part that matters in ninety days.
#
# This file deliberately does NOT touch any other server block, so the
# application already on this box is unaffected. nginx picks between them on
# server_name alone.

server {
    listen 80;
    listen [::]:80;
    server_name attendance.shareindiainsurance.com;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    # One location: the container's own nginx already serves the SPA, proxies
    # /api to the backend, sets the cache and security headers, and handles
    # client-side routing. Re-implementing any of that here would give two
    # places to change it and one of them would be forgotten.
    location / {
        proxy_pass http://127.0.0.1:8081;

        # HTTP/1.1 to the upstream, or nginx falls back to 1.0 and cannot
        # forward a chunked response. Report exports are streamed and chunked,
        # so on 1.0 they arrive truncated or not at all.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The one header that must be right. This is the only hop that speaks
        # TLS, so the scheme here is the real one; the container's nginx
        # forwards whatever arrives rather than overwriting it, and the
        # backend decides from it whether the request was encrypted.
        # certbot leaves this alone, so it keeps saying https after the
        # 443 block is added.
        proxy_set_header X-Forwarded-Proto $scheme;

        # An export of tens of thousands of rows takes longer than the default
        # 60s, and buffering it would defeat the point of streaming it.
        proxy_read_timeout 300s;
        proxy_buffering off;

        # Enough for a bulk-import CSV; the API enforces its own row limits.
        client_max_body_size 12m;
    }
}
