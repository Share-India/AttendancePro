# Host nginx virtual host for Attendance Pro, on an instance where nginx
# already serves another application on 80 and 443.
#
# Install:
#   sudo cp deploy/nginx-attendance.conf /etc/nginx/sites-available/attendance
#   sudo ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add TLS to this exact server block:
#   sudo certbot --nginx -d attendance.shareindia.co.in
#
# certbot rewrites this file: it adds a `listen 443 ssl`, the certificate
# paths, and a redirect from 80. That is expected — do not hand-write the
# TLS block, and do not be surprised when this file no longer matches the
# copy in the repository.
#
# This proxies the whole hostname to the SPA container, which already serves
# the built frontend and proxies /api/ on to the backend. Nothing here needs
# to know about /api: duplicating that routing would be a second place to get
# it wrong.

server {
    listen 80;
    listen [::]:80;
    server_name attendance.shareindia.co.in;

    # Must match docker-compose.behind-proxy.yml's FRONTEND_PORT.
    set $attendance_upstream http://127.0.0.1:8091;

    # The bulk employee import posts a CSV. nginx defaults to 1m and rejects
    # anything larger with a 413 before the application ever sees it.
    client_max_body_size 12m;

    location / {
        proxy_pass $attendance_upstream;

        # HTTP/1.1 to the upstream, or nginx falls back to 1.0 and cannot
        # forward a chunked response. Report exports are streamed and
        # chunked, so on 1.0 they arrive truncated or not at all.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # This is the hop that actually speaks TLS, so this is where the
        # original scheme is known. The container's own nginx passes whatever
        # arrives here straight through to Spring Boot; if it were missing,
        # the application would believe every request arrived over plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # An export of tens of thousands of rows takes longer than the
        # default 60s, and buffering it would defeat the point of streaming.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
